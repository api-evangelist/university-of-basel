apis:
- aid: university-of-basel:edoc-rest
  name: edoc DSpace REST API
  description: >-
    Public DSpace REST API for "edoc", the open-access institutional repository of the University of Basel,
    running DSpace-CRIS 7.6.2. The API root reports the repository name and server endpoints and exposes
    items, collections, communities, and metadata. Verified live (HTTP 200).
  humanURL: https://ub.unibas.ch/en/services/dh-digital-services/edoc/
  baseURL: https://edoc.unibas.ch/server/api
  tags:
  - Institutional Repository
  - Open Access
  - DSpace
  - Research Data
  - REST
  properties:
  - type: Documentation
    url: https://ub.unibas.ch/en/services/dh-digital-services/edoc/
- aid: university-of-basel:edoc-oai
  name: edoc OAI-PMH
  description: >-
    OAI-PMH 2.0 metadata harvesting interface for the University of Basel edoc repository. The Identify
    verb reports repositoryName "edoc: Open Access Repository University of Basel" and adminEmail openaccess@unibas.ch.
    Includes an OpenAIRE-CRIS metadata stream. Verified live (HTTP 200).
  humanURL: https://ub.unibas.ch/en/services/dh-digital-services/edoc/
  baseURL: https://edoc.unibas.ch/server/oai/request
  tags:
  - OAI-PMH
  - Metadata
  - Open Access
  - Institutional Repository
  - Harvesting
  properties:
  - type: Documentation
    url: https://ub.unibas.ch/en/services/dh-digital-services/edoc/
  - type: APIReference
    url: https://edoc.unibas.ch/server/oai/request?verb=Identify
- aid: university-of-basel:swisscovery-sru
  name: swisscovery (SLSP Alma) SRU
  description: >-
    Standards-based SRU (Search/Retrieve via URL) interface to the SLSP swisscovery / Alma discovery system
    for the University of Basel institution zone (41SLSP_UBS). Allows programmatic search and retrieval
    of library catalogue records for the Basel library network. Verified live (HTTP 200).
  humanURL: https://ub.unibas.ch/en/basel-library-network/
  baseURL: https://swisscovery.slsp.ch/view/sru/41SLSP_UBS
  tags:
  - Library
  - Catalogue
  - SRU
  - Discovery
  - Alma
  properties:
  - type: Documentation
    url: >-
      https://ub.unibas.ch/en/search-find/library-catalogues/swisscovery-registration-and-help/
- aid: university-of-basel:university-of-basel-admin-api-api
  name: DaSCH DSP-API — Admin API
  description: >-
    The DSP-API Admin API: projects, users, groups, lists, permissions and per-project legal information.
    66 operations, split by tag from the first-party DSP-API OpenAPI 3.1 contract published at https://api.dasch.swiss/api/docs/docs.yaml.
    Served at api.dasch.swiss, the host named in the contract’s own servers[] block.
  humanURL: https://docs.dasch.swiss/latest/DSP-API/
  baseURL: https://api.dasch.swiss
  tags:
  - Admin API
  properties:
  - type: OpenAPI
    url: openapi/university-of-basel-admin-api-api-openapi.yml
  - type: Documentation
    url: https://docs.dasch.swiss/latest/DSP-API/03-endpoints/api-admin/overview/
  - type: Overlay
    url: overlays/university-of-basel-admin-api-overlay.yaml
- aid: university-of-basel:university-of-basel-api-v2-api
  name: DaSCH DSP-API — API v2
  description: >-
    The DSP-API v2 content surface: reading, searching, creating and editing RDF resources and values,
    the Gravsearch graph query language, ontology management, standoff text markup, TEI rendering, IIIF
    manifests and ARK permalinks. 56 operations, split by tag from the first-party DSP-API OpenAPI 3.1
    contract.
  humanURL: https://docs.dasch.swiss/latest/DSP-API/
  baseURL: https://api.dasch.swiss
  tags:
  - API v2
  properties:
  - type: OpenAPI
    url: openapi/university-of-basel-api-v2-api-openapi.yml
  - type: Documentation
    url: https://docs.dasch.swiss/latest/DSP-API/03-endpoints/api-v2/introduction/
  - type: Overlay
    url: overlays/university-of-basel-api-v2-overlay.yaml
- aid: university-of-basel:university-of-basel-api-v3-api
  name: DaSCH DSP-API — API v3
  description: >-
    The emerging DSP-API v3 surface of client-optimized endpoints (ADR-0009): project export, import and
    data-graph migration. 10 operations. Carries the estate’s only machine-readable error-code enum (V3ErrorCode).
  humanURL: https://docs.dasch.swiss/latest/DSP-API/
  baseURL: https://api.dasch.swiss
  tags:
  - API v3
  properties:
  - type: OpenAPI
    url: openapi/university-of-basel-api-v3-api-openapi.yml
  - type: Documentation
    url: https://docs.dasch.swiss/latest/DSP-API/03-endpoints/api-v3/project-migration/
  - type: Overlay
    url: overlays/university-of-basel-api-v3-overlay.yaml
- aid: university-of-basel:university-of-basel-management-api-api
  name: DaSCH DSP-API — Management API
  description: >-
    The DSP-API instrumentation surface: GET /health, GET /version and the Prometheus metrics endpoint.
    3 operations, all anonymous. GET /version returns the running webapi, Fuseki, Scala and Sipi versions
    — a machine-readable runtime version signal.
  humanURL: https://docs.dasch.swiss/latest/DSP-API/
  baseURL: https://api.dasch.swiss
  tags:
  - Management API
  properties:
  - type: OpenAPI
    url: openapi/university-of-basel-management-api-api-openapi.yml
  - type: Documentation
    url: https://docs.dasch.swiss/latest/DSP-API/03-endpoints/instrumentation/introduction/
  - type: Overlay
    url: overlays/university-of-basel-management-api-overlay.yaml
- aid: university-of-basel:university-of-basel-ontology-mappings-api
  name: DaSCH DSP-API — Ontology Mappings
  description: >-
    DSP-API v3 ontology mapping operations: add or remove a single rdfs:subClassOf or rdfs:subPropertyOf
    triple linking a project class or property to an external IRI. 2 operations, both documented as idempotent.
  humanURL: https://docs.dasch.swiss/latest/DSP-API/
  baseURL: https://api.dasch.swiss
  tags:
  - Ontology Mappings
  properties:
  - type: OpenAPI
    url: openapi/university-of-basel-ontology-mappings-api-openapi.yml
  - type: Documentation
