note: >-
  All first-party client libraries for the University of Basel API estate are published by DaSCH
  (Swiss National Data and Service Center for the Humanities), the national infrastructure hosted at
  the University of Basel that builds and operates DSP-API. They wrap api.dasch.swiss, which is the
  DSP-API host named in the contract's own servers[] block. No first-party client library was found
  for the edoc DSpace REST API, the edoc OAI-PMH interface, or the swisscovery SRU interface — those
  are consumed with generic DSpace / OAI-PMH / SRU clients.
