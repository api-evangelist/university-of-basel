description: >-
  The University of Basel sells no API access and publishes no plan of any kind. Its open surfaces
  — the edoc DSpace REST API and the edoc OAI-PMH interface — are anonymous and free with no quota,
  no registration and no terms specific to programmatic use. Its closed surfaces — the UNIverse
  research information API, the sciCORE OpenID Connect issuer, the ADAM LTI endpoint — are not sold
  either; they are internal systems whose credentials are issued administratively, so there is
  nothing to price. This is an honest zero, not an unfilled section: a canton-funded public
  university with no developer program has no plans to record.
notes: >-
  The DaSCH rate card previously recorded here (long-term archiving above a free tier, consulting
  above a free allowance, read from https://www.dasch.swiss/services/pricing) was removed on
  2026-08-30 with the rest of the DaSCH-attributed estate. Those are real published prices, but
  they belong to DaSCH — a legally independent association hosted at the university — and pricing
  DaSCH's services under Basel's slug was part of the same misattribution as saving DaSCH's
  contract here.
