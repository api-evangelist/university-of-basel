generated: '2026-08-30'
method: probed
source: >-
  Live anonymous probes of every University of Basel institution-operated surface on 2026-08-30,
  plus the SWITCHaai federation metadata aggregate
  (https://metadata.aai.switch.ch/metadata.switchaai.xml), the eduGAIN aggregate
  (https://mds.edugain.org/edugain-v2.xml), the DataCite provider API and the Crossref members API.
  Every conforms: true row names the exact document, verb or metadata field the claim was read from.
provider: University of Basel
providerId: university-of-basel
description: >-
  Domain-standard conformance for the University of Basel, scored against the Kin Score `education`
  regulatory regime. The estate is scholarly and identity infrastructure, so the standards it
  actually speaks are the repository, persistent-identifier and federated-identity family —
  OAI-PMH, ORCID, DataCite, Crossref, SAML/Shibboleth — plus one learning-technology surface (LTI)
  on the university's ILIAS platform and one OpenAPI 3.1 contract on its research information
  system. No conformance is claimed from prose: each row below was
  fetched. Standards in the regime that were probed and NOT found are recorded as conforms: false
  rather than omitted, so the absence is measured rather than assumed.
standards:
- id: oai-pmh
  name: OAI-PMH 2.0 (Open Archives Initiative Protocol for Metadata Harvesting)
  conforms: true
  surface: university-of-basel:edoc-oai
  evidence:
    url: https://edoc.unibas.ch/server/oai/request?verb=Identify
    status: 200
    location: >-
      Identify response declares protocolVersion 2.0, repositoryName "edoc: Open Access Repository
      University of Basel", repositoryIdentifier edoc.unibas.ch, adminEmail openaccess@unibas.ch,
      granularity YYYY-MM-DDThh:mm:ssZ and deletedRecord transient.
  notes: >-
    ListMetadataFormats returns eleven prefixes — oai_dc, qdc, mods, mets, didl, ore, rdf, marc,
    dim, etdms, uketd_dc. The Identify response additionally carries an OpenAIRE-CRIS 1.1 Service
    description (https://www.openaire.eu/cerif-profile/1.1/), so the repository is harvestable both
    as plain Dublin Core and as a CERIF-profiled CRIS.
- id: orcid
  name: ORCID
  conforms: true
  surface: university-of-basel:edoc-rest
  evidence:
    url: https://edoc.unibas.ch/server/api/core/metadatafields?size=1000
    status: 200
    location: >-
      The edoc metadata-field registry (540 fields) declares person.identifier.orcid, author.orcid,
      orcid.authenticated, orcid.webhook, orcid.scope and the full cris.orcid.sync-* family
      (sync-mode, sync-profile, sync-publications, sync-fundings, sync-patents, sync-products).
  notes: >-
    The sync and webhook fields are DSpace-CRIS's live ORCID integration, not merely a place to
    type an identifier — the repository is configured to push and receive ORCID record updates.
- id: datacite
  name: DataCite
  conforms: true
  surface: university-of-basel:edoc-rest
  evidence:
    url: https://api.datacite.org/providers/ilen
    status: 200
    location: >-
      DataCite provider ILEN, displayName "University of Basel", memberType
      consortium_organization, created 2020-11-02.
  notes: >-
    Basel is a DataCite member in its own right, through the Swiss consortium, and mints DOIs for
    edoc content.
- id: crossref
  name: Crossref
  conforms: true
  surface: university-of-basel:edoc-rest
  evidence:
    url: https://api.crossref.org/members/27920
    status: 200
    location: >-
      Crossref member 27920, primary-name "University of Basel", DOI prefixes 10.24437 and
      10.12685.
  notes: Basel is a depositing Crossref member with two registered prefixes.
- id: saml
  name: SAML 2.0
  conforms: true
  surface: university-of-basel:switchaai-idp
  evidence:
    url: https://metadata.aai.switch.ch/metadata.switchaai.xml
    status: 200
    location: >-
      EntityDescriptor entityID="https://aai-logon.unibas.ch/idp/shibboleth" with an
      IDPSSODescriptor declaring protocolSupportEnumeration
      urn:oasis:names:tc:SAML:2.0:protocol.
  notes: >-
    Entity attributes on the same descriptor: REFEDS Research & Scholarship
    (http://refeds.org/category/research-and-scholarship), GÉANT Data Protection Code of Conduct v1,
    MyAcademicID ESI, REFEDS Sirtfi assurance certification, swissEduPersonHomeOrganization
    unibas.ch and swissEduPersonHomeOrganizationType "university". Thirty-two Basel-operated
    SPSSODescriptors under unibas.ch appear in the same aggregate.
- id: shibboleth
  name: Shibboleth / SWITCHaai / eduGAIN
  conforms: true
  surface: university-of-basel:switchaai-idp
  evidence:
    url: https://mds.edugain.org/edugain-v2.xml
    status: 200
    location: >-
      The eduGAIN interfederation aggregate contains the Basel entityID
      https://aai-logon.unibas.ch/idp/shibboleth, so the IdP is reachable to relying parties
      outside Switzerland as well as inside SWITCHaai.
  notes: >-
    The descriptor carries a shibmd:Scope of unibas.ch (regexp="false") and mdui:UIInfo display
    names in en/de/fr, which is Shibboleth-specific metadata rather than generic SAML.
- id: lti
  name: IMS Learning Tools Interoperability
  conforms: true
  surface: university-of-basel:adam-lti
  evidence:
    url: https://adam.unibas.ch/lti.php
    status: 200
    location: >-
      ILIAS LTI entry point answers an unauthenticated GET with the ILIAS LTI connection error
      string; a control request to https://adam.unibas.ch/notarealendpoint.php on the same host
      returns 404, which distinguishes a deployed endpoint from a catch-all.
  notes: >-
    Launch-only. No tool configuration document, JWKS or LTI Advantage service endpoint is
    published publicly, so the version in use (LTI 1.1 vs 1.3) could not be established from
    outside. Recorded as a live endpoint, not as a documented integration surface.
