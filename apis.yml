- aid: university-of-basel:universe-research-information
  name: UNIverse Research Information System API
  x-operator: institution
  description: >-
    The REST backend of UNIverse (universe.unibas.ch), the University of Basel's research
    information system, at https://universe-intern.unibas.ch/api. It is the only OpenAPI contract
    the university itself serves: OpenAPI 3.1.0, title "Super MedMe API", version 1.16.2.191, 1,671
    paths and 1,170 schemas, one securityScheme ("Bearer Token"), covering publications, books,
    persons, departments, reviewers, stakeholder review workflow and room/meeting administration.
    The contract names no vendor — no info.contact, no license, and its only server is the
    unibas.ch host itself, which resolves into the university's own network
    (lzm-medme-fe-prod1.meddek.unibas.ch, 131.152.217.196). A springdoc Swagger UI is served
    alongside it. Verified live 2026-08-30: the contract and Swagger UI answer 200 anonymously, and
    a data path answers 401 with {"timestamp":…,"status":401,"error":"Unauthorized","path":…},
    which establishes the token is enforced rather than merely declared.
  humanURL: https://universe.unibas.ch/
  baseURL: https://universe-intern.unibas.ch/api
  tags:
  - Research Information
  - CRIS
  - Publications
  - OpenAPI
  - Internal
  properties:
  - type: APIReference
    url: https://universe-intern.unibas.ch/api/v3/api-docs
  - type: Documentation
    url: https://universe-intern.unibas.ch/api/swagger-ui/index.html
  - type: Website
    url: https://universe.unibas.ch/
  x-harvest-decision: >-
    The contract is NOT mirrored into openapi/ and no artifacts are derived from it, by choice.
    The host is named "intern", the system is an internal research-administration application of
    the Medical Faculty holding person-level records, and the university runs a public
    vulnerability disclosure program. The surface is recorded because it is anonymously reachable
    and it is the institution's own engineering; copying 1.4 MB of its endpoint documentation into
    a public catalog repository is a separate act that a human should authorize. A later pass must
    not "complete" this entry by harvesting it.
