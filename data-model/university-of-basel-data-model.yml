source: >-
  Derived from components.schemas of the DSP-API OpenAPI 3.1 contract
  (https://api.dasch.swiss/api/docs/docs.yaml, v37.8.0) — 188 schemas — cross-read against
  https://docs.dasch.swiss/latest/DSP-API/02-dsp-ontologies/knora-base/ and the repo's
  vocabulary/university-of-basel-vocabulary.yml.
provider: University of Basel
providerId: university-of-basel
api: university-of-basel:dsp-api
description: >-
  DSP is an RDF graph store with an administrative layer bolted in front of it, and the data model
  splits cleanly along that seam. The ADMIN entities below — Project, User, Group, Permission, List
  — are conventional JSON objects with an OpenAPI schema. The CONTENT entities — Resource, Value,
  Ontology, Class, Property, Standoff — are RDF and are described by the knora-base ontology rather
  than by JSON Schema, so the contract types them loosely and the real shape is per-project. Any
  agent working here must fetch the project's ontology before it can construct a valid resource.
identifiers:
  primary: IRI
  note: >-
    Every entity is addressed by an IRI, not by an opaque string id. Project IRIs take the form
    http://rdfh.ch/projects/{shortcode}; resource IRIs http://rdfh.ch/{shortcode}/{id}; user IRIs
    http://rdfh.ch/users/{id}.
  secondary:
  - name: shortcode
    scope: Project
    format: 4-digit hexadecimal string
    example: '0001'
    note: The most usable project handle; most admin routes accept it as an alternative to the IRI.
  - name: shortname
    scope: Project
  - name: valueUuid
    scope: Value
  - name: ARK
    scope: Project, Resource, Value version
    format: ark:/72163/...
    note: >-
      Externally citable permalink, resolvable to a specific version of an object. See
      conformance/university-of-basel-conformance.yml.
entities:
- name: Project
  schema: Project
  description: >-
    A research project. Owns its ontologies, its data, its lists, its permissions and its licensing
    configuration. The unit of tenancy in DSP.
  key_fields:
  - id
  - shortname
  - shortcode
  - longname
  - description
  - keywords
  - ontologies
  - status
  - selfjoin
  - allowedCopyrightHolders
  - enabledLicenses
  - dataLicense
  - dataCopyrightHolder
  operations:
  - getAdminProjects
  - getAdminProjectsShortcodeProjectshortcode
  - getAdminProjectsShortnameProjectshortname
  - getAdminProjectsIriProjectiri
- name: User
  schema: UserDto
  description: An account, with group and project memberships and a derived permissions profile.
  key_fields:
  - id
  - username
  - email
  - givenName
  - familyName
  - status
  - lang
  - groups
  - projects
  - permissions
  operations:
  - getAdminUsersIriUseriri
  - getAdminUsersEmailEmail
  - getAdminUsersUsernameUsername
- name: Group
  schema: Group
  description: A collection of users inside a project to which permissions are assigned.
  key_fields:
  - id
  - name
  - descriptions
  - project
  - status
  - selfjoin
  operations:
  - getAdminGroups
  - getAdminGroupsGroupiri
- name: AdministrativePermission
  schema: AdministrativePermissionADM
  description: Grants administrative capabilities to a group within a project.
  key_fields:
  - iri
  - forProject
  - forGroup
  - hasPermissions
- name: DefaultObjectAccessPermission
  schema: DefaultObjectAccessPermissionADM
  description: >-
    Defines default access rights on objects created within a project, group, resource class or
    property.
  key_fields:
  - iri
  - forProject
  - forGroup
  - forResourceClass
  - forProperty
  - hasPermissions
- name: List
  schema: ListRootNodeADM
  description: A hierarchical controlled vocabulary used to constrain property values in a project.
  key_fields:
  - id
  - projectIri
  - name
  - labels
  - comments
  - children
  - isRootNode
  operations:
  - getAdminLists
  - getAdminListsP1
  - getAdminListsP1Info
- name: ListChildNode
  schema: ListChildNodeADM
  key_fields:
  - id
  - name
  - labels
  - comments
  - position
  - hasRootNode
  - children
- name: Ontology
  schema: OntologyDto
  description: >-
    An RDF data model defining resource classes and properties for a project. Extends knora-base.
  key_fields:
  - iri
  - label
  - comment
  operations:
  - getV2OntologiesMetadata
  - getV2OntologiesAllentitiesOntologyiri
- name: ResourceClass
  schema: ResourceClassDto
  key_fields:
  - iri
  - representationClass
  - label
  - comment
  operations:
  - getV2OntologiesClassesClassiri
- name: Property
  schema: (untyped in contract; knora-base:Property in RDF)
  operations:
  - getV2OntologiesPropertiesPropertyiri
- name: Resource
  schema: (JSON-LD, shaped by the project ontology)
  description: >-
    The primary unit of humanities research data. Not typed by a JSON Schema in the contract — the
    valid shape is whatever the project's ontology declares.
  operations:
  - getV2Resources
  - getV2Resourcespreview
  - getV2ResourcesHistoryResourceiri
  - getV2GraphResourceiri
- name: Value
  schema: (JSON-LD, typed by knora-api value classes)
  description: >-
    A versioned property value attached to a resource. Values are never overwritten; each edit
    creates a new version and the old one remains readable.
  operations:
  - getV2ValuesResourceiriValueuuid
- name: License
  schema: ProjectLicenseDto
  key_fields:
  - id
  - uri
  - labelEn
  - isRecommended
  - isEnabled
  operations:
  - getAdminProjectsShortcodeProjectshortcodeLegal-infoLicenses
- name: RestrictedViewSettings
  schema: (RestrictedViewSettings)
  description: Project-level watermark/size settings controlling restricted display of media.
  operations:
  - getAdminProjectsIriProjectiriRestrictedviewsettings
- name: DataTask
  schema: DataTaskStatusResponse
  description: An asynchronous v3 export or import job.
  key_fields:
  - id
  - projectIri
  - status
  - createdBy
  - createdAt
  - errorMessage
relationships:
- from: Project
  to: Ontology
  type: has_many
  via: Project.ontologies
- from: Ontology
  to: ResourceClass
  type: has_many
