generated: '2026-08-27'
method: searched
source: >-
  https://docs.dasch.swiss/latest/DSP-API/ (mkdocs search index, 4,075 documents) and the DSP-API
  OpenAPI 3.1 contract https://api.dasch.swiss/api/docs/docs.yaml (v37.8.0), both read 2026-08-27;
  plus live probes of https://edoc.unibas.ch/server/api.
provider: University of Basel
providerId: university-of-basel
scope: >-
  Cross-cutting runtime semantics for the DSP-API surface (api.dasch.swiss), which is the only
  surface in this estate with a machine-readable contract. Where the edoc DSpace REST API or the
  swisscovery SRU interface differ, that is called out.
authentication:
  style: bearer-jwt
  scheme: 'Authorization: Bearer <JWT>'
  obtain:
    operation: POST /v2/authentication
    body: '{"identifier_type": "iri|email|username", "password": "<password>"}'
    response: '{"token": "<JWT>"}'
  revoke:
    operation: DELETE /v2/authentication
    effect: Invalidates the access token; further requests carrying it are rejected.
  check:
    operation: GET /v2/authentication
  alternate: >-
    HTTP Basic is declared as a second securityScheme (httpAuth1) in the contract, but the docs say
    plainly "Any other method of authentication is deprecated."
  anonymous_reads: >-
    54 GET operations are marked "Publicly accessible" in the contract and need no credential.
  docs: https://docs.dasch.swiss/latest/DSP-API/03-endpoints/api-v2/authentication/
  cross_reference: authentication/university-of-basel-authentication.yml
idempotency:
  keys: false
  header: null
  scope: null
  retention: null
  state: na-not-offered
  note: >-
    No Idempotency-Key header, no idempotency-key language in the contract or the documentation. A
    retried POST /v2/resources creates a second resource. The only idempotence guarantees are
    HTTP-level (PUT/DELETE) plus two v3 mapping operations whose descriptions state it explicitly —
    deleteV3OntologiesOntologyiriClassesClassiriMapping and
    deleteV3OntologiesOntologyiriPropertiesPropertyiriMapping both say "Idempotent: deleting an
    absent mapping succeeds."
  optimistic_concurrency:
    mechanism: knora-api:lastModificationDate
    note: >-
      Every resource/value/ontology mutation carries the object's current lastModificationDate in
      the request body. If someone else has written since the caller last read, the write fails with
      409 EditConflictException. This is the estate's real double-write guard — it prevents a
      clobber, not a duplicate.
    docs: https://docs.dasch.swiss/latest/DSP-API/03-endpoints/api-v2/editing-resources/
pagination:
  style: mixed
  patterns:
  - surface: /v2 search and resources
    params:
    - name: offset
      occurrences: 5
      description: Zero-based page offset; DSP-API returns a fixed page of results per offset.
    - name: page
      occurrences: 5
    - name: page-size
      occurrences: 4
    - name: order
      occurrences: 4
    note: >-
      Count endpoints are published alongside the list endpoints — getV2SearchCountSearchterm,
      getV2SearchbylabelCountSearchterm, getV2SearchextendedCountP1,
      getV2SearchstillimagerepresentationscountResourceiri — so a client can size the result set
      before walking it.
  - surface: edoc DSpace REST API
    params:
    - name: page
    - name: size
    style: spring-data page/size with HAL `_links.next`
    note: Probed live at https://edoc.unibas.ch/server/api (application/hal+json).
  - surface: edoc OAI-PMH
    style: resumptionToken
    note: Standard OAI-PMH 2.0 flow control.
  - surface: swisscovery SRU
    style: startRecord / maximumRecords
    note: Standard SRU 1.2.
  cursor: false
content_negotiation:
  note: >-
    The most distinctive convention in this API. DSP-API v2 negotiates BOTH the serialisation and
    the semantic schema of the same resource.
  media_types:
  - application/ld+json
  - text/turtle
  - application/trig
  - application/n-quads
  - application/rdf+xml
  custom_headers:
  - name: x-knora-accept-schema
    occurrences: 57
    description: Choose the ontology schema of the response (complex or simple).
  - name: x-knora-json-ld-rendering
    occurrences: 57
    description: Choose the JSON-LD rendering (flat or hierarchical).
  - name: x-knora-accept-markup
    occurrences: 57
    description: Choose how standoff markup is returned (XML or standoff).
  - name: x-knora-accept-project
    occurrences: 3
  query_equivalents:
  - schema
  - markup
  - allLanguages
field_selection:
  expansion: false
  sparse_fields: false
  note: >-
    No field-expansion or sparse-fieldset convention. Shape is controlled by the schema/markup
    negotiation above and by Gravsearch, which lets the caller specify exactly which properties to
    return in a query.
filtering_and_query:
  languages:
  - name: Gravsearch
    description: >-
      A SPARQL-derived virtual graph search language, submitted to
      GET /v2/searchextended/{query} (getV2SearchextendedP1) or its POST equivalent. This is the
      full-power query surface.
    docs: https://docs.dasch.swiss/latest/DSP-API/03-endpoints/api-v2/query-language/
  - name: full-text
    operation: getV2SearchSearchterm
  - name: label search
    operation: getV2SearchbylabelSearchterm
  common_filters:
  - limitToProject
  - limitToResourceClass
  - limitToStandoffClass
metadata_and_tracing:
  request_id: false
  note: >-
    No X-Request-Id or correlation-id header is declared in the contract or observed on live
    responses, so a client cannot quote an ID when reporting a fault. Server-side, DSP-API emits
    OpenTelemetry traces to Grafana (see the Observability section of the docs), but no trace
    identifier is surfaced to the caller.
  metrics_endpoint:
    path: /metrics
    docs: https://docs.dasch.swiss/latest/DSP-API/03-endpoints/instrumentation/metrics/
versioning:
  style: url-path
  cross_reference: lifecycle/university-of-basel-lifecycle.yml
errors:
  envelope: '{"message": "..."}'
  v3_envelope: '{"message": "...", "errors": [{"code": "<V3ErrorCode>", "message": "...", "details": {}}]}'
  rfc9457: false
  cross_reference: errors/university-of-basel-problem-types.yml
rate_limit_signaling:
  headers: []
  status_on_exhaustion: null
  note: >-
    No rate-limit headers declared or observed. Cross-reference
    rate-limits/university-of-basel-rate-limits.yml.
dry_run_mode:
  supported: true
  grade: verified
  mechanism: >-
    DSP-API publishes a family of "can-delete" pre-flight operations that answer whether a
    destructive change is permissible BEFORE it is attempted, without performing it. This is a
    genuine rehearsal surface for the estate's most dangerous verbs.
  operations:
  - operationId: getV2ResourcesCandelete
    path: GET /v2/resources/candelete
    checks: Whether a resource can be deleted.
  - operationId: getV2OntologiesCandeleteclassResourceclassiri
    path: GET /v2/ontologies/candeleteclass/{resourceClassIri}
    checks: Whether a class can be deleted (i.e. is unused in data).
  - operationId: getV2OntologiesCandeletepropertyPropertyiri
    path: GET /v2/ontologies/candeleteproperty/{propertyIri}
    checks: Whether a property can be deleted.
  - operationId: getV2OntologiesCandeleteontologyOntologyiri
    path: GET /v2/ontologies/candeleteontology/{ontologyIri}
    checks: Whether an ontology can be deleted.
  - operationId: postV2OntologiesCandeletecardinalities
    path: POST /v2/ontologies/candeletecardinalities
    checks: Whether cardinalities can be removed from a class.
  - operationId: getAdminListsCandeleteP1
    path: GET /admin/lists/candelete/{p1}
    checks: Whether a list can be deleted (none of its nodes is used in data).
  - operationId: dsp-tools validate-data
    path: null
    checks: >-
      CLI-side: validates an XML data file against the project's data model before any upload is
      attempted.
  gap: >-
    No dry-run for CREATE or UPDATE — only for delete. A client cannot rehearse a resource creation
    or an ontology change.
reversibility:
  grade: documented
  summary: >-
    DSP is an archival system, and its write model reflects that: ordinary deletes are SOFT — the
    triple is retained, flagged knora-api:isDeleted, and stamped with a knora-api:deleteDate and an
    optional knora-api:deleteComment. Nothing is lost. But DaSCH publishes a documented restore
    operation for only ONE class of object (users and groups, via the status flag); for resources
    and values the data survives the delete while the API exposes no published un-delete route. A
    separate family of `erase` operations is explicitly and permanently irreversible, and the docs
    say so in capitals. The grade is `documented` rather than `verified` because the estate's main
    write surface — resources and values — has a reversal-by-retention story but no stated reversal
    OPERATION and no stated window.
  surfaces:
  - surface: Admin users
    write_operation: deleteAdminUsersIriUseriri (DELETE /admin/users/iri/{userIri})
    semantics: Sets status to false; the user record is retained.
    reversal_operation: 'PUT /admin/users/iri/{userIri}/Status with body {"status": true}'
    window: >-
      None stated and none implied — the record is retained indefinitely, so the reversal is
      available at any time.
    grade: verified
    docs: https://docs.dasch.swiss/latest/DSP-API/03-endpoints/api-admin/users/#delete-user
    quote: >-
      "Remark: The same as updating a user and changing status to false. To un-delete, set status
      to true."
  - surface: Admin groups
    write_operation: deleteAdminGroupsGroupiri (DELETE /admin/groups/{groupIri})
    semantics: >-
      "Deletes a group by changing its status to 'false'." — the group is retained.
    reversal_operation: 'PUT /admin/groups/{groupIri}/status with body {"status": true}'
    window: None stated; the record is retained.
    grade: documented
    docs: https://docs.dasch.swiss/latest/DSP-API/03-endpoints/api-admin/groups/#delete-group
  - surface: v2 resources
    write_operation: postV2ResourcesDelete (POST /v2/resources/delete)
    semantics: >-
      "Knora does not normally delete resources; instead, it marks them as deleted, which means that
      they do not appear in normal query results." The resource keeps its IRI and its ARK permalink,
      and a direct or ARK request returns a knora-base:DeletedResource carrying deleteDate and
      deleteComment.
    reversal_operation: null
    window: null
    grade: documented
    note: >-
      Data is retained, so the delete is recoverable in principle — but no un-delete route is
      published, and no window is stated. An agent must treat it as one-way through the API.
    docs: https://docs.dasch.swiss/latest/DSP-API/03-endpoints/api-v2/editing-resources/#deleting-a-resource
  - surface: v2 values
    write_operation: postV2ValuesDelete (POST /v2/values/delete)
    semantics: >-
      Same soft-delete model. Values are versioned, and the version history remains readable via
      getV2ResourcesHistoryResourceiri and getV2ValuesResourceiriValueuuid.
    reversal_operation: null
    window: null
    grade: documented
    note: >-
      Because values are versioned rather than overwritten, an UPDATE is effectively reversible by
      reading the prior version out of history and re-writing it — but that is a client-side
      reconstruction, not a published reversal operation.
    docs: https://docs.dasch.swiss/latest/DSP-API/03-endpoints/api-v2/editing-values/#deleting-a-value
  - surface: Erase operations
    write_operation: >-
      postV2ResourcesErase, postV2ValuesErase, postV2ValuesErasehistory,
      deleteAdminProjectsShortcodeProjectshortcodeErase
    semantics: >-
      Permanent removal from the triplestore. The project-erase description begins "!ATTENTION!
      Erase a project with the given shortcode. This will permanently and irrecoverably remove the
      project and all its assets."
    reversal_operation: null
    window: null
    grade: irreversible
    note: >-
      Correctly and loudly flagged in the contract itself, and gated on SystemAdmin. These are the
      operations an agent must never take without a human.
  - surface: v3 exports and imports
    write_operation: deleteV3ProjectsProjectiriExportsExportid, deleteV3ProjectsProjectiriImportsImportid
    semantics: >-
      "Deletes an export irrevocably. Only exports in state failed or completed can be deleted."
      In-progress jobs cannot be deleted, which is itself a safety property.
    reversal_operation: null
    window: null
    grade: irreversible
  read_only: false
