- aid: university-of-basel:adam-lti
  name: ADAM (ILIAS) LTI launch endpoint
  x-operator: institution
  description: >-
    LTI launch endpoint on ADAM, the University of Basel's ILIAS learning management system, at
    https://adam.unibas.ch/lti.php. It answers an unauthenticated GET with the ILIAS LTI error
    string rather than a 404 — a control request to a non-existent path on the same host returns
