generated: '2026-08-27'
method: searched
source: https://docs.dasch.swiss/latest/DSP-TOOLS/
provider: University of Basel
providerId: university-of-basel
api: university-of-basel:dsp-api
name: DSP-TOOLS
description: >-
  DSP-TOOLS is the first-party command line interface for the DaSCH Service Platform API, published
  by DaSCH (the national humanities data centre hosted at the University of Basel). It is the
  practical entry point to DSP-API for researchers: it creates projects from JSON definitions,
  converts Excel workbooks into project/ontology/list JSON, validates and bulk-uploads XML data,
  runs the ingest pipeline, migrates projects between servers, and can stand up a complete local DSP
  stack in Docker. It also ships `xmllib`, a Python library for constructing the mass-upload XML.
version: 19.0.2
released: '2026-08-26'
repository: https://github.com/dasch-swiss/dsp-tools
changelog: https://docs.dasch.swiss/latest/DSP-TOOLS/changelog/
package: packages/university-of-basel-packages.yml
install:
- method: pip
  command: pip3 install dsp-tools
- method: pip-upgrade
  command: pip3 install --upgrade dsp-tools
  note: >-
    The docs warn that pip will silently install an OUTDATED DSP-TOOLS if the local Python is older
    than the supported versions — a real and documented footgun.
commands:
- group: Project definition
  commands:
  - name: create
    usage: dsp-tools create project.json
    description: Create a project on a server from a JSON definition file.
  - name: get
    usage: dsp-tools get -P 0XXX project.json
    description: Retrieve a project definition JSON from a server.
- group: Excel conversion
  commands:
  - name: excel2json
    usage: dsp-tools excel2json excelfolder project.json
    description: Create the project definition JSON from Excel files.
  - name: excel2lists
    usage: dsp-tools excel2lists excelfolder lists.json
    description: Create the list section of the project JSON.
  - name: excel2properties
    usage: dsp-tools excel2properties properties.xlsx properties.json
    description: Create the properties section of the JSON.
  - name: excel2resources
    usage: dsp-tools excel2resources resources.xlsx resources.json
    description: Create the resource section of the JSON.
  - name: old-excel2json
    usage: dsp-tools old-excel2json excelfolder project.json
    description: Create the project definition JSON using the old Excel format.
  - name: old-excel2lists
    usage: dsp-tools old-excel2lists excelfolder lists.json
    description: Create the list section using the old Excel format.
- group: Data upload and ingest
  commands:
  - name: validate-data
    usage: dsp-tools validate-data data.xml
    description: Validate XML data against the project's data model before uploading.
  - name: upload-files
    usage: dsp-tools upload-files data.xml
    description: Upload the multimedia files referenced in an XML file.
  - name: ingest-files
    usage: dsp-tools ingest-files 0XXX
    description: Kick off the ingest process and save the mapping CSV.
  - name: ingest-xmlupload
    usage: dsp-tools ingest-xmlupload data.xml
    description: Create resources from XML after the files have been ingested.
  - name: resume-xmlupload
    usage: dsp-tools resume-xmlupload
    description: Resume a previously interrupted xmlupload.
  - name: id2iri
    usage: dsp-tools id2iri new_data.xml id2iri_mapping.json
    description: Replace internal IDs with IRIs in an XML file.
  - name: update-legal
    usage: dsp-tools update-legal [options] data.xml
    description: Move legal metadata onto <bitstream> attributes.
- group: Ontology mapping
  commands:
  - name: mapping config
    usage: dsp-tools mapping config -P 0XXX --ontology my-onto
    description: Create a mapping YAML config file.
  - name: mapping update
    usage: dsp-tools mapping update 0XXX-my-onto-mapping.yaml
    description: Replace external ontology mappings from an Excel file.
- group: Migration
  commands:
  - name: migration config
    usage: dsp-tools migration config -P 0XXX
    description: Create a migration config YAML file.
  - name: migration export
    usage: dsp-tools migration export migration-0XXX.yaml
    description: Download project data from the source server.
  - name: migration import
    usage: dsp-tools migration import migration-0XXX.yaml
    description: Import a downloaded export to another server.
  - name: migration complete
    usage: dsp-tools migration complete migration-0XXX.yaml
    description: Execute a complete migration end to end.
  - name: migration clean-up
    usage: dsp-tools migration clean-up migration-0XXX.yaml
    description: Clean up local files and server references after a migration.
- group: Local stack
  commands:
  - name: start-stack
    usage: dsp-tools start-stack
    description: Start a local DSP stack (DSP-API + DSP-APP) in Docker.
    options:
    - '--max_file_size=int (default 2000): max multimedia file size in MB, max 100000'
    - '--prune: run `docker system prune` without asking'
  - name: stop-stack
    usage: dsp-tools stop-stack
    description: Stop the local DSP stack.
key_flows:
- name: Model a project in Excel and publish it
  steps:
  - dsp-tools excel2json excelfolder project.json
  - dsp-tools create project.json
- name: Bulk-load a data set with media
  steps:
  - dsp-tools validate-data data.xml
  - dsp-tools upload-files data.xml
  - dsp-tools ingest-files 0XXX
  - dsp-tools ingest-xmlupload data.xml
- name: Move a project between servers
  steps:
  - dsp-tools migration config -P 0XXX
  - dsp-tools migration export migration-0XXX.yaml
  - dsp-tools migration import migration-0XXX.yaml
  - dsp-tools migration clean-up migration-0XXX.yaml
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
