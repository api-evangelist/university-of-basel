schemes:
- name: httpAuth
  type: http
  scheme: bearer
  bearer_format: JWT
  surface: university-of-basel:dsp-api
  status: current
  description: >-
    The supported authentication method. A client POSTs credentials to /v2/authentication and
    receives a JSON Web Token, then sends it on every secured request as
    `Authorization: Bearer <token>`.
  obtain:
    method: POST
    path: /v2/authentication
    request: '{"identifier_type": "iri|email|username", "password": "<password>"}'
    response: '{"token": "eyJ0eXAiOiJ..."}'
  verify:
    method: GET
    path: /v2/authentication
  revoke:
    method: DELETE
    path: /v2/authentication
    effect: >-
      Invalidates the access token server-side; a later request presenting the same token is
      rejected. A genuine logout, not just a client-side discard.
  sources:
  - https://docs.dasch.swiss/latest/DSP-API/03-endpoints/api-v2/authentication/
