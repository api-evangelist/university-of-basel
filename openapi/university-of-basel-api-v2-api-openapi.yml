components:
  schemas:
    SearchTimeoutException:
      title: SearchTimeoutException
      type: object
      required:
      - message
      properties:
        message:
          type: string
    OntologyConstraintException:
      title: OntologyConstraintException
      type: object
      required:
      - message
      properties:
        message:
          type: string
    EditConflictException:
      title: EditConflictException
      type: object
      required:
      - message
      properties:
        message:
          type: string
    ListResponseDto:
      title: ListResponseDto
      type: object
      required:
      - count
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceInfoDto'
        count:
          type: integer
          format: int32
    ForbiddenException:
      title: ForbiddenException
      type: object
      required:
      - message
      properties:
        message:
          type: string
    GravsearchException:
      title: GravsearchException
      type: object
      required:
      - message
      properties:
        message:
          type: string
    IriPassword:
      title: IriPassword
      type: object
      required:
      - iri
      - password
      properties:
        iri:
          description: IRI for a user.
          type: string
        password:
          type: string
    CreateStandoffMappingForm:
      title: CreateStandoffMappingForm
      type: object
      required:
      - json
      - xml
      properties:
        json:
          type: string
        xml:
          type: string
    ErrorResponse:
      title: ErrorResponse
      type: object
      required:
      - message
      properties:
        message:
          type: string
    BadRequestException:
      title: BadRequestException
      type: object
      required:
      - message
      properties:
        message:
          type: string
    ReorderValuesResponse:
      title: ReorderValuesResponse
      type: object
      required:
      - resourceIri
      - propertyIri
      - valuesReordered
      properties:
        resourceIri:
          type: string
        propertyIri:
          type: string
        valuesReordered:
          type: integer
          format: int32
    UsernamePassword:
      title: UsernamePassword
      type: object
      required:
      - username
      - password
      properties:
        username:
          $ref: '#/components/schemas/Username'
        password:
          type: string
    ValidationException:
      title: ValidationException
      type: object
      required:
      - msg
      properties:
        msg:
          type: string
    ExportFormat:
      title: ExportFormat
      default: CSV
      type: string
      enum:
      - CSV
      - JSON
      - TSV
    LoginPayload:
      title: LoginPayload
      oneOf:
      - $ref: '#/components/schemas/EmailPassword'
      - $ref: '#/components/schemas/IriPassword'
      - $ref: '#/components/schemas/UsernamePassword'
    ResourcesBatchRequest:
      title: ResourcesBatchRequest
      type: object
      properties:
        resourceIris:
          type: array
          maxItems: 100
          minItems: 1
          items:
            type: string
    Username:
      title: Username
      type: object
      required:
      - value
      properties:
        value:
          type: string
    TokenResponse:
      title: TokenResponse
      type: object
      required:
      - token
      properties:
        token:
          type: string
    ResourceInfoDto:
      title: ResourceInfoDto
      type: object
      required:
      - resourceIri
      - creationDate
      - lastModificationDate
      - isDeleted
      properties:
        resourceIri:
          type: string
        creationDate:
          type: string
          format: date-time
        lastModificationDate:
          type: string
          format: date-time
        deleteDate:
          type: string
          format: date-time
        isDeleted:
          type: boolean
    NotFoundException:
      title: NotFoundException
      type: object
      required:
      - message
      properties:
        message:
          type: string
    ConflictException:
      title: ConflictException
      type: object
      required:
      - message
      properties:
        message:
          type: string
    CheckResponse:
      title: CheckResponse
      type: object
      required:
      - message
      properties:
        message:
          type: string
    BadCredentialsException:
      title: BadCredentialsException
      type: object
      required:
      - message
      properties:
        message:
          type: string
    EmailPassword:
      title: EmailPassword
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          pattern: ^.+@.+$
        password:
          type: string
    LogoutResponse:
      title: LogoutResponse
      type: object
      required:
      - status
      - message
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
    DuplicateValueException:
      title: DuplicateValueException
      type: object
      required:
      - message
      properties:
        message:
          type: string
    ReorderValuesRequest:
      title: ReorderValuesRequest
      type: object
      required:
      - resourceIri
      - propertyIri
      properties:
        resourceIri:
          type: string
        propertyIri:
          type: string
        orderedValueIris:
          type: array
          items:
            type: string
  securitySchemes:
    httpAuth:
      type: http
      scheme: bearer
    httpAuth1:
      type: http
      scheme: basic
