description: >-
  No API in this estate is metered or sold. Every published surface — the edoc DSpace REST API, the
  edoc OAI-PMH interface, the swisscovery SRU interface and the DaSCH DSP-API — is called free of
  charge with no plan, no quota and no contract. What DaSCH DOES publish, and publishes precisely,
  is a rate card for the human services around the platform: long-term archiving above a free tier,
  and consulting above a free allowance. Those are recorded below because they are the only real
  published prices attached to this estate, not because API calls are billed.
notes: >-
  Read live from https://www.dasch.swiss/services/pricing and
  https://www.dasch.swiss/faq/costs-support on 2026-08-27 (both HTTP 200). DaSCH is funded by the
  Swiss National Science Foundation (SNSF), which is why the repository service is free to Swiss
  research. Currency is Swiss francs; VAT is stated by DaSCH where it applies.
