reviews:
  - date: '2026-08-30'
    rating: 3
    summary: >-
      Re-profiled under the university pipeline, which settles WHO OPERATES each surface before
      saving anything. The 2026-06-03 review credited the University of Basel with the DaSCH
      Service Platform API. That was wrong. DaSCH is a legally independent association — its own
      legal notice names DaSCH at Kornhausgasse 7, 4051 Basel, and its about page says it acts
      "independently of any single Higher Education Institution" — which the university hosts and
      part-funds. Its contract names DaSCH as info.contact and api.dasch.swiss as its only server.
      Six OpenAPI contracts, eight apis[] entries and 45 artifacts derived from them were removed.
      What replaced them is smaller and actually Basel's: the edoc repository on two interfaces, a
      SWITCHaai/eduGAIN SAML identity provider with 32 service providers beside it, a sciCORE
      OpenID Connect issuer, an ILIAS LTI endpoint, and — the find of the pass — the UNIverse
      research information system, which serves a live OpenAPI 3.1 contract and a Swagger UI
      anonymously while enforcing a bearer token on data. The rating is unchanged because the
      footprint is genuinely comparable in size; it is simply now the university's own.
    endpoints:
