      - name: resourceIri
        in: path
        description: The IRI of a Resource.
        required: true
        schema:
          type: string
      - name: valueUuid
        in: path
        description: The UUID of a Value.
        required: true
        schema:
          type: string
      - name: version
        in: query
        required: false
        schema:
          type: string
      - name: x-knora-accept-schema
