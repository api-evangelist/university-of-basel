- aid: university-of-basel:edoc-rest
  name: edoc DSpace REST API
  x-operator: institution
  description: >-
    Public DSpace REST API for "edoc", the open-access institutional repository of the University of
    Basel, running DSpace-CRIS 7.6.2 (cris-2023.02.06) on the university's own host. The API root
    reports dspaceName "edoc: Open Access Repository University of Basel" and links the full HAL
    surface — items, collections, communities, bitstreams, the metadata-field registry and the
