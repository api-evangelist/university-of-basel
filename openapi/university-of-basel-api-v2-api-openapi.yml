  /v2/lists/{listIri}:
    get:
      tags:
      - API v2
      description: Returns a list (a graph with all list nodes).
      operationId: getV2ListsListiri
      parameters:
      - name: listIri
        in: path
        description: The iri to a list.
        required: true
        schema:
          type: string
        example: http://rdfh.ch/lists/0001/MK5zjenqSeKYAmqWz7XupQ
      - name: allLanguages
        in: query
        description: If true, return rdfs:label and rdfs:comment as JSON-LD arrays of language-tagged objects (sorted alphabetically by tag). Default false preserves the legacy single-string shape.
        required: false
        schema:
          default: false
          type: boolean
      - name: x-knora-accept-schema
        in: header
        description: 'The ontology schema to be used for the request.

          If not specified, the default schema ApiV2Complex will be used.'
        required: false
        schema:
          type: string
      - name: schema
        in: query
        description: 'The ontology schema to be used for the request.

          If not specified, the default schema ApiV2Complex will be used.'
        required: false
        schema:
          type: string
      - name: x-knora-json-ld-rendering
        in: header
        description: 'The JSON-LD rendering to be used for the request (flat or hierarchical).

          If not specified, hierarchical JSON-LD will be used.'
        required: false
        schema:
          type: string
      - name: markup
        in: query
        description: The markup rendering to be used for the request (XML or standoff).
        required: false
        schema:
          type: string
      - name: x-knora-accept-markup
        in: header
        description: The markup rendering to be used for the request (XML or standoff).
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          headers:
            Content-Type:
              required: true
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                type: string
            text/turtle:
              schema:
                type: string
            application/trig:
              schema:
                type: string
            application/rdf+xml:
              schema:
                type: string
            application/n-quads:
              schema:
                type: string
        '400':
          description: ''
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/OntologyConstraintException'
                - $ref: '#/components/schemas/DuplicateValueException'
                - $ref: '#/components/schemas/ValidationException'
                - $ref: '#/components/schemas/BadRequestException'
                - $ref: '#/components/schemas/GravsearchException'
                - $ref: '#/components/schemas/EditConflictException'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadCredentialsException'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenException'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictException'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - httpAuth: []
      - httpAuth1: []
