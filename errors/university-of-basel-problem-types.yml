rfc9457: false
envelope:
  v2_and_admin:
    shape: '{"message": "<human-readable text>"}'
    required:
    - message
    note: >-
      The DSP-API v2 and Admin API surfaces return a single-field JSON object. The HTTP status code
      and the schema name in the contract carry the type; the body itself is untyped, so a client
      cannot branch on a machine-readable code. 163 operations share this envelope.
  v3:
    shape: '{"message": "<text>", "errors": [{"code": "<V3ErrorCode>", "message": "<text>", "details": {}}]}'
    required:
    - message
    note: >-
      The newer API v3 surface adds a machine-readable errors[] array whose `code` is drawn from a
      closed enum (V3ErrorCode). This is the only branchable error signal in the estate.
statuses:
- status: 400
  operations: 172
  meaning: Bad request — malformed input, failed validation, or a violated ontology constraint.
  schemas:
  - BadRequestException
  - ValidationException
  - OntologyConstraintException
  - DuplicateValueException
  - GravsearchException
  - EditConflictException
  remediation: >-
    Re-read the ontology definition (getV2OntologiesAllentitiesOntologyiri) before retrying; a
    GravsearchException means the query text itself is invalid, not that no results matched.
- status: 401
  operations: 179
  meaning: Unauthenticated — no token, expired token, or bad credentials.
  schemas:
  - BadCredentialsException
  - Unauthorized
  remediation: >-
    Obtain a fresh JWT by POSTing {"identifier_type": "...", "password": "..."} to
    /v2/authentication and resend as `Authorization: Bearer <token>`.
- status: 403
  operations: 179
  meaning: Authenticated but not permitted by the DSP permissions system for this project or object.
  schemas:
  - ForbiddenException
  - Forbidden
  remediation: >-
    Check the caller's administrative and default-object-access permissions on the project; a
    restricted-view setting can also mask an asset rather than deny it.
- status: 404
  operations: 179
  meaning: Resource, value, ontology, project or list node not found — or soft-deleted.
  schemas:
  - NotFoundException
  - NotFound
  remediation: >-
    A DSP resource is never hard-deleted; a 404 on a known IRI usually means it was marked deleted.
    Request the deleted resource explicitly (see "Requesting Deleted Resources") or read its
    history with getV2ResourcesHistoryResourceiri.
- status: 409
  operations: 170
  meaning: Conflict — a concurrent edit, or a duplicate that violates a uniqueness constraint.
  schemas:
  - ConflictException
  - EditConflictException
  - Conflict
  remediation: >-
    Re-read the value's current UUID and lastModificationDate, then re-issue the update. DSP-API
    uses last-modification-date optimistic concurrency on ontology updates.
- status: 500
  operations: 163
  meaning: Unhandled server error.
  schemas:
  - ErrorResponse
  remediation: Retry with backoff; report persistent failures through the DaSCH helpdesk.
- status: 503
  operations: 2
  meaning: Search timed out before completing.
  schemas:
  - SearchTimeoutException
  paths:
  - GET /v2/search/{searchTerm}
  - GET /v2/search/count/{searchTerm}
  remediation: >-
    Narrow the search term or use the count endpoint first; a Gravsearch query that scans a large
    graph should be paged with the offset parameter rather than retried unchanged.
