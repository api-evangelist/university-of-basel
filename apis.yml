- aid: university-of-basel:switchaai-idp
  name: University of Basel SWITCHaai / eduGAIN Identity Provider
  x-operator: institution
  description: >-
    Basel's SAML 2.0 identity provider, entityID https://aai-logon.unibas.ch/idp/shibboleth,
    registered in the SWITCHaai federation and exported to eduGAIN. Its metadata declares
    shibmd:Scope unibas.ch, swissEduPersonHomeOrganization unibas.ch,
    swissEduPersonHomeOrganizationType "university", REFEDS Research & Scholarship, the GÉANT Data
    Protection Code of Conduct v1, MyAcademicID ESI, and REFEDS Sirtfi assurance certification. The
    same aggregate carries thirty-two Basel-operated service providers under unibas.ch — ADAM,
    forschdb2, grants, drittmittel, personeninfo, oauth-logon and the faculty systems. The
    federation aggregate is published by SWITCH; the entity, its keys and its endpoints are the
    university's. Metadata verified live 2026-08-30 (HTTP 200, 21.3 MB aggregate); the IdP host
    itself publishes no public DNS record, so the metadata is the readable surface.
  humanURL: https://its.unibas.ch/en/
  baseURL: https://aai-logon.unibas.ch/idp/shibboleth
