aid: university-of-basel
name: University of Basel
x-type: university
x-category: Public Research University
description: >-
  The University of Basel (Universität Basel) is the oldest university in Switzerland, founded in
  1460, and a canton-funded public research university. It operates no developer portal, no
  self-serve API program and no public product API; every machine-readable surface it runs is
  scholarly infrastructure, federated identity, or the back end of one of its own administrative
  systems. Exactly one OpenAPI contract is served under unibas.ch — the REST back end of UNIverse,
  the research information system, which publishes an OpenAPI 3.1.0 description and a Swagger UI
  anonymously while enforcing a bearer token on every data path. Beyond it, verified live on the
  university's own hosts: "edoc", the open-access institutional repository running
  DSpace-CRIS 7.6.2, which answers on both a DSpace REST API and an OAI-PMH 2.0 interface carrying
  eleven metadata formats and an OpenAIRE-CRIS profile; a SWITCHaai / eduGAIN SAML 2.0 identity
  provider scoped to unibas.ch, alongside thirty-two registered service providers under the same
  domain; an OpenID Connect issuer at the sciCORE scientific computing centre; and an LTI launch
  endpoint on ADAM, the university's ILIAS learning platform. Library discovery is a tenancy, not a
  Basel system — swisscovery is operated by SLSP on Ex Libris Alma, with Basel holding the
  41SLSP_UBS institution zone. The DaSCH Service Platform API (api.dasch.swiss), previously
  catalogued here as Basel's, is not: DaSCH is a legally independent association hosted at the
  university, and that contract and its derived artifacts were removed in the 2026-08-30 pass.
