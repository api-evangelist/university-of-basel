plan_count: 5
plans:
- id: university-of-basel-api-open
  name: Open API Access
  type: free
  description: >-
    All four published API surfaces are anonymous and free. 54 DSP-API GET operations are marked
    "Publicly accessible" in the contract; edoc's DSpace REST and OAI-PMH interfaces and the
    swisscovery SRU interface need no credential at all.
  entries:
  - label: Open API Access
    name: open_api_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    currency: CHF
    userMultiplied: false
- id: university-of-basel-dsp-archiving-free
  name: DSP Archiving — free tier
  type: free
  description: >-
    "The DaSCH repository service is free of charge for national research projects or those with
    Swiss participation." Long-term archiving is free for data sets up to 500 GB. No fees apply to
    project data stored in the DaSCH Service Platform before the beginning of 2025.
  entries:
  - label: Long-term archiving up to 500 GB
    name: archiving_free
    type: free
    metric: storage
    limit: 500
    unitOfMeasure: GB
    timeFrame: year
    geo: CH
    unit: 1
    price: '0.00'
    currency: CHF
    userMultiplied: false
- id: university-of-basel-dsp-archiving-cost-shared
  name: DSP Archiving — cost sharing above 500 GB
  type: negotiated
  description: >-
    "For data volumes exceeding 500 GB, annual cost sharing by the project or its hosting
    institution may be required." DaSCH does not publish a per-GB figure; the amount is agreed with
    the project.
  entries:
  - label: Annual hosting cost sharing
    name: archiving_overage
    type: negotiated
    metric: storage
    limit: -1
    unitOfMeasure: GB
    timeFrame: year
    geo: CH
    unit: 1
    price: null
    currency: CHF
    userMultiplied: false
