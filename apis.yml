    documentation, tool-configuration URL or JWKS is published publicly; launches require an
    institutional LTI credential. ILIAS is open-source software; the deployment and host
    (fip-adam-001.its.unibas.ch) are Basel IT Services'. Verified live 2026-08-30 (HTTP 200).
