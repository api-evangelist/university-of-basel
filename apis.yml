x-coverage:
  state: covered
  reason: covered
  detail: >-
    Six institution-operated surfaces and one tenancy were verified live on 2026-08-30, and the
    thinness beyond them is the institution's, not a fetch failure. The find of the pass is
    universe-intern.unibas.ch/api — the REST backend of the UNIverse research information system,
    which serves an OpenAPI 3.1.0 contract (1,671 paths, 1,170 schemas) and a springdoc Swagger UI
    anonymously while enforcing a bearer token on data paths (401 with a structured envelope). It
    was reached by reading the API base out of the public Angular bundle of universe.unibas.ch,
    whose own paths all return a soft-200 SPA shell. It is the only OpenAPI the university itself
    serves, and it is deliberately not mirrored into this repository — see the entry's
    x-harvest-decision. Also institution-operated and verified: edoc.unibas.ch/server/api (DSpace-CRIS 7.6.2, HTTP 200, anonymous read, 540 metadata
    fields readable including person.identifier.orcid and the cris.orcid.* sync registry);
    edoc.unibas.ch/server/oai/request (OAI-PMH 2.0, eleven metadata formats, OpenAIRE-CRIS 1.1
    service description); the SWITCHaai/eduGAIN SAML identity provider
    https://aai-logon.unibas.ch/idp/shibboleth, read from the 21.3 MB SWITCHaai aggregate and
    confirmed present in the 93 MB eduGAIN aggregate, with Sirtfi, REFEDS R&S and GÉANT CoCo entity
    categories and 32 Basel service providers alongside it;
    iam.scicore.unibas.ch/realms/switch-eduid (Keycloak OIDC discovery, HTTP 200); and
    adam.unibas.ch/lti.php (ILIAS LTI launch, HTTP 200 against a 404 control on the same host).
    Tenant, not Basel's: swisscovery.slsp.ch/view/sru/41SLSP_UBS (SLSP AG on Ex Libris Alma) and
    the e-manuscripta.ch/bau consortium platform. Removed this pass as vendor-attributed: the DaSCH
    DSP-API estate — DaSCH is a legally independent association (legal notice: DaSCH, Kornhausgasse
    7, 4051 Basel; about-us: "an association ... acting independently of any single Higher
    Education Institution") that the University of Basel hosts and part-funds, and whose contract
    names DaSCH as contact and api.dasch.swiss as its only server. Confirmed absent: no DNS for
    data.unibas.ch, api.unibas.ch, developer.unibas.ch, opendata.unibas.ch, research.unibas.ch or
    aai.unibas.ch; www.unibas.ch/llms.txt 404 and /.well-known/security.txt 503; no public API for
    the Vorlesungsverzeichnis course directory, and none on the public faces of universe.unibas.ch
    or forschdb2.unibas.ch, whose Angular front ends answer every probed API path with the same
    384 KB SPA shell at HTTP 200; ub.unibas.ch/digi/ 403 from nginx. Seen
    but not verifiable: the UB Basel IIIF stack (ub-sipi.ub.unibas.ch answers a IIIF-shaped path
    with 403 rather than 404, ub-iiifpresentation.ub.unibas.ch resolves into the university network)
    — no public manifest or collection URL could be reached, so no surface was recorded for it.
  assessed: '2026-08-30'
