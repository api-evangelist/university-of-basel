        required: true
        schema:
          type: string
      - name: resourceClass
        in: query
        required: true
        schema:
          type: string
      - name: order
        in: query
        description: Sort the results in ascending (asc) or descending (desc) order.
        required: false
        schema:
          default: Asc
          type: string
      - name: orderBy
        in: query
        description: Sort the results by the specified property.
        required: false
        schema:
          default: LastModificationDate
          type: string
