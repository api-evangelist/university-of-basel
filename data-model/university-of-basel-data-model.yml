notes:
- >-
  The single most important thing for a consumer to understand: there is no global content schema.
  Read the project's ontology (getV2OntologiesAllentitiesOntologyiri) first; the resource shape is
  derived from it at runtime.
- >-
  Values are append-only versions, not mutable fields. Reading history is a first-class operation,
  which is why the reversibility story in conventions/ leans on retention.
